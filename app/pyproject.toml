[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raseen"
version = "0.2.0"
description = "Raseen (رَصين) — Block Gradient Control dashboard for gigawatt solar, built on the NAJM-3000 pre-commissioning twin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    # Physics engine vendored from the NAJM-3000 twin (feeds the Plant page's simulated telemetry).
    "pvlib>=0.10",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "playwright>=1.45",
    "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["raseen*", "najm3000*"]

[tool.setuptools.package-data]
raseen = ["static/**/*", "web/**/*", "registry/data/*.json"]
najm3000 = ["dashboard/static/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["e2e: browser smoke tests (need `playwright install chromium`)"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The vendored NAJM-3000 package keeps its own upstream style; Raseen lints only its own code.
extend-exclude = ["najm3000"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
